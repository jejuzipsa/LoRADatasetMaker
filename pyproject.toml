[project]
name = "loradatasetmaker"
version = "0.0.5"
description = "Local LoRA identity dataset preprocessing and review tool for Windows"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7,<7",
    "opencv-python>=4.9,<5",
    "numpy>=1.26,<3",
    "Pillow>=10,<12",
]

[project.scripts]
loradatasetmaker = "loradatasetmaker.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
